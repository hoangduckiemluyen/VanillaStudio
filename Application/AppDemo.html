<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./Build/Style.min.css">

</head>
<body>
    <!-- Begin: Vanilla Studio ----------------------------------------------------------------------------------------------------- -->
    <div id="__vanilla_studio__" class="vanilla theme-dark">

        <div class="component inline nowrap vertical">
            <div class="list">

                <!-- Begin: Header --------------------------------------------------------------------------------------- -->
                <div class="item border">
                    
                    <!-- Begin: Header - Menu -------------------------------------------------------------------------------------- -->
                    <div class="component menu horizontal">
                        <div class="overlay"></div>
                        <ul class="list horizontal" depth="0">
                            <li class="item">
                                <button class="field">File</button>
                                <ul class="list vertical" depth="1">
                                    <li class="item"><button class="field">New Project</button></li>
                                    <li class="item"><button class="field">Close Project</button></li>
                                    <li class="item"><button class="field">Add File</button></li>
                                    <li class="item"><button class="field">Save</button></li>
                                    <li class="item"><button class="field">Exit</button></li>
                                </ul>
                            </li>
                            <li class="item"><button class="field">Export</button></li>
                            <li class="item"><button class="field">About</button></li>
                        </ul>
                    </div>
                    <!-- End: Header - Menu -------------------------------------------------------------------------------------- -->
                
                 </div>
                <!-- End: Header --------------------------------------------------------------------------------------- -->
                
                <!-- Begin: Body ---------------------------------------------------------------------------------------------------- -->
                <div class="item">
                    <div class="component inline nowrap horizontal border">
                        <div class="list">

                            <!-- Begin: Body - Left -------------------------------------------------------------------------------------- -->
                            <div class="item">
                            
                            </div>
                            <!-- End: Body - Left -------------------------------------------------------------------------------------- -->
                            
                            <!-- Begin: Body - Left -------------------------------------------------------------------------------------- -->
                            <div class="item"></div>
                            <!-- End: Body - Left -------------------------------------------------------------------------------------- -->
                            
                            
                            <!-- Begin: Body - Right -------------------------------------------------------------------------------------- -->
                            <div class="item"></div>
                            <!-- End: Body - Right -------------------------------------------------------------------------------------- -->
                            
                        </div>
                    </div>
                </div>
                <!-- End: Body ---------------------------------------------------------------------------------------------------- -->
            
            </div>
        </div>
    </div>
    <!-- End: Vanilla Studio ----------------------------------------------------------------------------------------------------- -->
        
    <script src="./Build/Script.min.js"></script>
</body>
</html>
